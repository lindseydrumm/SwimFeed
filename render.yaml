databases:
  - name: swimlive-db
    plan: free
    databaseName: swimlive
    user: swimlive

services:
  # ── Backend (Docker) ──────────────────────────────────
  - type: web
    name: swimlive-api
    runtime: docker
    plan: free
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: swimlive-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://swimlive.onrender.com,http://localhost:5173
      - key: DEBUG
        value: "false"

  # ── Frontend (Static Site) ────────────────────────────
  - type: web
    name: swimlive
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: web
    envVars:
      - key: VITE_API_BASE_URL
        value: https://swimlive-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
